<svg xmlns="http://www.w3.org/2000/svg" width="920" height="250" viewBox="0 0 920 250" role="img" aria-labelledby="title desc">
  <title id="title">Michael Robles - Cybersecurity, network security and infrastructure</title>
  <desc id="desc">A dark terminal-inspired banner with neon green and cyan accents.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#07131a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="50%" r="48%">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff9c"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#22d3ee" stroke-width="0.55" opacity="0.13"/>
    </pattern>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="920" height="250" rx="16" fill="url(#background)"/>
  <rect width="920" height="250" rx="16" fill="url(#glow)"/>
  <rect x="1" y="1" width="918" height="248" rx="15" fill="none" stroke="#1f6f5a" stroke-opacity="0.75"/>
  <rect x="20" y="58" width="880" height="172" rx="10" fill="url(#grid)"/>

  <line x1="20" y1="54" x2="900" y2="54" stroke="#1f6f5a" stroke-opacity="0.7"/>
  <circle cx="39" cy="28" r="5" fill="#ff5f56"/>
  <circle cx="58" cy="28" r="5" fill="#ffbd2e"/>
  <circle cx="77" cy="28" r="5" fill="#27c93f"/>
  <text x="100" y="33" fill="#8b949e" font-family="Consolas, 'Liberation Mono', monospace" font-size="13">iClexi@security-lab: ~</text>
  <text x="758" y="33" fill="#00ff9c" font-family="Consolas, 'Liberation Mono', monospace" font-size="12">STATUS // ONLINE</text>

  <text x="52" y="91" fill="#00ff9c" font-family="Consolas, 'Liberation Mono', monospace" font-size="15">$ whoami --professional</text>
  <text x="52" y="140" fill="#f0f6fc" font-family="Consolas, 'Liberation Mono', monospace" font-size="44" font-weight="700" letter-spacing="2.2">MICHAEL ROBLES</text>
  <text x="54" y="174" fill="#22d3ee" font-family="Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" letter-spacing="1.55">CYBERSECURITY  //  NETWORK SECURITY  //  INFRASTRUCTURE</text>
  <text x="54" y="211" fill="#8b949e" font-family="Consolas, 'Liberation Mono', monospace" font-size="13">build &gt; secure &gt; validate &gt; document</text>
  <rect x="52" y="224" width="430" height="2" rx="1" fill="url(#accent)" opacity="0.75"/>

  <g transform="translate(742 138)" filter="url(#soft-glow)">
    <path d="M0 -46 L40 -23 L40 23 L0 46 L-40 23 L-40 -23 Z" fill="#031711" stroke="#00ff9c" stroke-width="2"/>
    <path d="M0 -26 L22 -13 L22 13 L0 26 L-22 13 L-22 -13 Z" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="6" fill="#00ff9c"/>
    <circle cx="-78" cy="-38" r="5" fill="#22d3ee"/>
    <circle cx="82" cy="-35" r="5" fill="#22d3ee"/>
    <circle cx="-82" cy="38" r="5" fill="#00ff9c"/>
    <circle cx="80" cy="40" r="5" fill="#00ff9c"/>
    <path d="M-74 -35 L-38 -20 M78 -32 L38 -19 M-78 35 L-38 20 M76 37 L38 20" stroke="url(#accent)" stroke-width="1.5" fill="none"/>
  </g>
  <text x="694" y="207" fill="#8b949e" font-family="Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1.1">SECURE // OPERATE</text>
</svg>
